name: Build Smart USB Guardian clients

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "tools/PREPARE_VAULT_ONLY_USB.ps1"
      - "tools/PREPARE_VAULT_ONLY_USB.cmd"
      - ".github/workflows/build-clients.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Windows build tools
        run: python -m pip install --upgrade pip pyinstaller requests

      - name: Build Open Secure USB.exe
        shell: pwsh
        run: |
          Set-Location clients/windows_usb_guardian
          python -m PyInstaller --clean --noconfirm --onefile --name "Open Secure USB" client.py

      - name: Build USBMonitor.exe
        shell: pwsh
        run: |
          Set-Location clients/windows_usb_monitor
          python -m PyInstaller --clean --noconfirm --onefile --noconsole --name USBMonitor usb_monitor.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android APK
        shell: pwsh
        run: |
          Set-Location clients/android
          .\gradlew.bat --no-daemon clean assembleDebug

      - name: Create downloadable packages
        shell: pwsh
        run: |
          $downloads = Join-Path $PWD "site/downloads"
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null

          Copy-Item "clients/windows_usb_guardian/dist/Open Secure USB.exe" "$downloads/Open_Secure_USB.exe" -Force
          Copy-Item "clients/windows_usb_guardian/dist/Open Secure USB.exe" "$downloads/USBGuardian.exe" -Force
          Copy-Item "clients/windows_usb_monitor/dist/USBMonitor.exe" "$downloads/USBMonitor.exe" -Force
          Copy-Item "clients/android/app/build/outputs/apk/debug/app-debug.apk" "$downloads/USBGuardianMobile.apk" -Force

          $monitorPackage = Join-Path $env:RUNNER_TEMP "monitor-package"
          New-Item -ItemType Directory -Path $monitorPackage -Force | Out-Null
          Copy-Item "$downloads/USBMonitor.exe" "$monitorPackage/USBMonitor.exe" -Force

          @'
          @echo off
          setlocal
          set "INSTALL_DIR=%LOCALAPPDATA%\SmartUSBGuardian"
          set "TARGET=%INSTALL_DIR%\USBMonitor.exe"
          set "SOURCE=%~dp0USBMonitor.exe"
          set "STARTUP=%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup"
          set "SHORTCUT=%STARTUP%\Smart USB Guardian Monitor.lnk"

          if not exist "%SOURCE%" (
            echo USBMonitor.exe is missing from this setup folder.
            pause
            exit /b 1
          )

          taskkill /IM USBMonitor.exe /F >nul 2>&1
          if not exist "%INSTALL_DIR%" mkdir "%INSTALL_DIR%"
          copy /Y "%SOURCE%" "%TARGET%" >nul

          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$s=(New-Object -ComObject WScript.Shell).CreateShortcut('%SHORTCUT%');$s.TargetPath='%TARGET%';$s.WorkingDirectory='%INSTALL_DIR%';$s.Save()"
          start "" "%TARGET%"

          echo.
          echo Smart USB Guardian Monitor installed and started.
          echo Installed at: %TARGET%
          pause
          '@ | Set-Content "$monitorPackage/SETUP_USB_MONITOR.bat" -Encoding ASCII

          @'
          @echo off
          setlocal
          set "INSTALL_DIR=%LOCALAPPDATA%\SmartUSBGuardian"
          set "STARTUP=%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup"
          taskkill /IM USBMonitor.exe /F >nul 2>&1
          del /Q "%STARTUP%\Smart USB Guardian Monitor.lnk" >nul 2>&1
          rmdir /S /Q "%INSTALL_DIR%" >nul 2>&1
          echo Smart USB Guardian Monitor uninstalled.
          pause
          '@ | Set-Content "$monitorPackage/UNINSTALL_USB_MONITOR.bat" -Encoding ASCII

          @'
          SMART USB GUARDIAN - ONE CLICK MONITOR SETUP

          1. Extract this ZIP.
          2. Double-click SETUP_USB_MONITOR.bat.
          3. Insert a registered pendrive containing Open Secure USB.exe, usb_guardian.id, and secure_data.hc.

          The monitor installs for the current Windows user and starts automatically at sign-in.
          '@ | Set-Content "$monitorPackage/README_ONE_CLICK_SETUP.txt" -Encoding UTF8

          $monitorZip = "$downloads/Smart_USB_Guardian_One_Click_Setup.zip"
          if (Test-Path $monitorZip) { Remove-Item $monitorZip -Force }
          Compress-Archive -Path "$monitorPackage/*" -DestinationPath $monitorZip -CompressionLevel Optimal

          $windowsPackage = Join-Path $env:RUNNER_TEMP "windows-client-package"
          New-Item -ItemType Directory -Path $windowsPackage -Force | Out-Null
          Copy-Item "$downloads/Open_Secure_USB.exe" "$windowsPackage/Open Secure USB.exe" -Force
          Copy-Item "tools/PREPARE_VAULT_ONLY_USB.ps1" "$windowsPackage/PREPARE_VAULT_ONLY_USB.ps1" -Force
          Copy-Item "tools/PREPARE_VAULT_ONLY_USB.cmd" "$windowsPackage/PREPARE_VAULT_ONLY_USB.cmd" -Force
          @'
          SMART USB GUARDIAN - VAULT-ONLY WINDOWS USB PACKAGE

          REQUIRED PENDRIVE ROOT:
          - Open Secure USB.exe
          - usb_guardian.id
          - secure_data.hc

          1. Register the USB on the owner website.
          2. Download usb_guardian.id separately.
          3. Create a VeraCrypt container named secure_data.hc.
          4. Keep every private file inside secure_data.hc.
          5. Double-click PREPARE_VAULT_ONLY_USB.cmd to copy and verify the three root files.

          When the application is opened manually, an activation event is recorded.
          When the Windows Monitor is installed, insertion is detected automatically.
          '@ | Set-Content "$windowsPackage/README_OPEN_FIRST.txt" -Encoding UTF8

          $windowsZip = "$downloads/Smart_USB_Guardian_Windows_Client.zip"
          if (Test-Path $windowsZip) { Remove-Item $windowsZip -Force }
          Compress-Archive -Path "$windowsPackage/*" -DestinationPath $windowsZip -CompressionLevel Optimal

          $manifest = @{
            built_at = (Get-Date).ToUniversalTime().ToString("o")
            api_url = "https://smart-usbguardian.netlify.app/api"
            windows_client = "Open_Secure_USB.exe"
            usb_monitor = "USBMonitor.exe"
            android_app = "USBGuardianMobile.apk"
          } | ConvertTo-Json
          $manifest | Set-Content "$downloads/build-manifest.json" -Encoding UTF8

      - name: Commit generated client downloads
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/downloads
          if (git diff --cached --quiet) {
            Write-Host "No client build changes to commit."
            exit 0
          }
          git commit -m "Build Netlify client downloads [skip clients]"

          $pushed = $false
          for ($i = 0; $i -lt 5; $i++) {
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Rebase conflict, aborting and retrying..."
              git rebase --abort
              Start-Sleep -Seconds 5
              continue
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            Write-Host "Push rejected (main moved on), retrying..."
            Start-Sleep -Seconds 5
          }
          if (-not $pushed) {
            Write-Error "Failed to push client downloads after retries."
            exit 1
          }
